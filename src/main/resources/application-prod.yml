spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://localhost:3306/team05_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 3600000
  refresh-expiration: 604800000

ai:
  mode: ${AI_MODE:quickdraw}
  gateway:
    base-url: ${AI_GATEWAY_BASE_URL:}
    api-key: ${AI_GATEWAY_API_KEY:}
    model: ${AI_MODEL:}

storage:
  mode: local
  local:
    upload-dir: ${STORAGE_LOCAL_UPLOAD_DIR:/home/ubuntu/uploads}
    base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080/files/uploads}

logging:
  level:
    root: INFO