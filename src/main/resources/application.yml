spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  output:
    ansi:
      enabled: ALWAYS
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:mem:drawrace;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
        auto: false

jwt:
  secret: ${JWT_SECRET_KEY:your_default_secret_key_at_least_32_bytes_long}
  access-expiration: 3600000
  refresh-expiration: 604800000

ai:
  mode: quickdraw
  inference:
    # 게이트웨이 동시 호출 상한 (방 최대 인원과 맞추는 것을 권장)
    max-concurrent: 4
    # 세마포어 획득 대기 초. 0이면 무제한 대기(큐에 쌓임)
    acquire-timeout-seconds: 120
  gateway:
    base-url: ${AI_GATEWAY_BASE_URL:}
    api-key: ${AI_GATEWAY_API_KEY:}
    model: ${AI_MODEL:}

storage:
  mode: local
  local:
    upload-dir: ${STORAGE_LOCAL_UPLOAD_DIR:uploads}
    base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080/files/uploads}