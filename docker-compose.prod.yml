# EC2 운영 서버에서 사용하는 compose 파일. (Tier 1)
#
# Tier 0 대비 변경점:
#   - mysql / redis 서비스 제거 — 이제 RDS / ElastiCache(관리형)로 분리됨.
#     이 파일이 띄우는 컨테이너는 app 하나뿐이다.
#   - DB/Redis 접속 host를 컨테이너 이름(mysql/redis)이 아니라 .env의
#     DB_HOST / REDIS_HOST(관리형 서비스 엔드포인트)에서 받는다.
#
# 배포 스크립트가 IMAGE_TAG 환경변수를 넣어주면 그 태그의 이미지를 받는다.
# (예: IMAGE_TAG=v0.2.0 docker compose -f docker-compose.prod.yml up -d)

services:
  app:
    image: ghcr.io/nohgar/drawrace2026-extended:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # host만 .env에서 주입 — 나머지 쿼리스트링은 Tier 0과 동일
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/${DB_NAME:-team05_db}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: 6379
      STORAGE_MODE: local
      STORAGE_LOCAL_UPLOAD_DIR: /app/uploads
      # 실제 서비스 도메인/IP로 .env에서 반드시 덮어쓸 것
      STORAGE_LOCAL_BASE_URL: ${STORAGE_LOCAL_BASE_URL}
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
