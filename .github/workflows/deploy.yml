name: Build and Deploy (tag release)

# main에 push할 때가 아니라, v0.1.0 같은 릴리즈 태그를 push할 때만 배포한다.
# 즉 "머지"가 아니라 "태그"가 배포를 트리거하는 신호.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 이미지 태그 (예: v0.1.0). 롤백 시 이전 태그를 넣는다."
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name/tag
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # workflow_dispatch로 이전 태그를 재배포할 때는 새로 빌드할 필요 없이
      # 이미 GHCR에 있는 이미지를 그대로 쓰면 되므로 빌드를 건너뛴다.
      - name: Skip build on manual redeploy
        id: skip
        run: echo "skip=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd ~/apps/INT1-Project-Team05
            git fetch origin main
            git checkout origin/main -- docker-compose.prod.yml
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
