services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # application-prod.yml에 하드코딩된 localhost 대신,
      # 컨테이너 네트워크 안에서는 서비스 이름이 곧 호스트명이 된다.
      # (Spring Boot는 환경변수를 yml보다 우선 적용하므로 코드 수정 불필요)
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-team05_db}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # S3를 쓰지 않는 기본 구성이므로 로컬 디스크 저장으로 지정
      STORAGE_MODE: local
      STORAGE_LOCAL_UPLOAD_DIR: /app/uploads
      STORAGE_LOCAL_BASE_URL: http://localhost:8080/files/uploads
    volumes:
      # 컨테이너를 재생성해도 업로드 파일이 유지되도록 named volume에 저장
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-team05_db}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  uploads:
